<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Même valeur que le token --color-bg (vérifié par test). -->
    <meta name="theme-color" content="#f5f1e9" />
    <meta name="description" content="Carnet d’entraînement personnel, 100 % local et hors ligne." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Carnet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" sizes="180x180" />
    <title>Carnet</title>
    <script>
      // Thème (V1.7.5) : posé sur <html> avant le premier rendu, depuis le miroir localStorage
      // de la préférence (pas de flash). L'app resynchronise depuis la base au démarrage.
      (function () {
        try {
          var preference = localStorage.getItem('training-app-theme');
          var dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          // Stockage indisponible : thème clair jusqu'à la lecture de la base.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
